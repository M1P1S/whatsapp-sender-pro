<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat WhatsApp - PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 { font-size: 1.2em; }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .topbar-actions button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
    }

    .topbar-actions button:hover {
      background: rgba(255,255,255,0.3);
    }

    .chat-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 350px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-header input {
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: white;
      font-size: 0.9em;
      outline: none;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }

    .chat-item:hover { background: #f5f5f5; }
    .chat-item.active { background: #e8f5e9; }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
      flex-shrink: 0;
    }

    .chat-info { flex: 1; min-width: 0; }
    .chat-info h4 {
      font-size: 0.95em;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-info p {
      font-size: 0.8em;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .unread-badge {
      background: #25D366;
      color: white;
      border-radius: 50%;
      min-width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75em;
      font-weight: bold;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .chat-header {
      padding: 12px 20px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h3 { font-size: 1em; color: #333; }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9em;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .message.sent {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message .time {
      font-size: 0.7em;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .no-chat-selected {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999;
      gap: 15px;
    }

    .no-chat-selected svg {
      width: 100px;
      height: 100px;
      opacity: 0.3;
    }

    /* Input Area */
    .input-area {
      padding: 10px 20px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-size: 0.95em;
      outline: none;
    }

    .input-area button {
      background: #25D366;
      border: none;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-area button:hover { background: #128C7E; }

    .loading-chats {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-area { display: none; }
      .chat-area.active { display: flex; }
      .sidebar.hidden { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>💬 Chat WhatsApp</h1>
    <div class="topbar-actions">
      <button onclick="window.location.href='/dashboard.html'">Dashboard</button>
      <button onclick="refreshChats()">Atualizar</button>
    </div>
  </div>

  <div class="chat-layout">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <input type="text" id="search-input" placeholder="Buscar conversa..." oninput="filterChats()">
      </div>
      <div class="chat-list" id="chat-list">
        <div class="loading-chats">Carregando conversas...</div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="no-chat-selected" id="no-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <h3>Selecione uma conversa</h3>
        <p>Escolha um contato na lista ao lado para iniciar</p>
      </div>

      <!-- Active Chat (hidden by default) -->
      <div id="active-chat" style="display: none; flex-direction: column; flex: 1;">
        <div class="chat-header">
          <div class="chat-avatar" id="chat-contact-avatar">?</div>
          <div>
            <h3 id="chat-contact-name">Contato</h3>
          </div>
        </div>
        <div class="messages-container" id="messages-container"></div>
        <div class="input-area">
          <input type="text" id="message-input" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter')sendChatMessage()">
          <button onclick="sendChatMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '';
    const TOKEN_KEY = 'token_' + (window.location.port || '80');
    let token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('token');
    let allChats = [];
    let currentChatId = null;
    let lastMessageId = null;

    if (!token) {
      window.location.href = '/auth.html';
    }

    // Verificar se é PRO
    async function checkAccess() {
      try {
        const res = await fetch(`${API_URL}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok || data.user.plan !== 'PRO') {
          alert('Chat disponível apenas para plano PRO');
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        window.location.href = '/auth.html';
      }
    }

    async function loadChats() {
      try {
        const res = await fetch(`${API_URL}/api/chat/list`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error);

        allChats = data.chats || [];
        renderChats(allChats);
      } catch (err) {
        console.error('Erro ao carregar chats:', err);
        document.getElementById('chat-list').innerHTML =
          '<div class="loading-chats">Erro ao carregar. WhatsApp conectado?</div>';
      }
    }

    function renderChats(chats) {
      const container = document.getElementById('chat-list');
      if (!chats.length) {
        container.innerHTML = '<div class="loading-chats">Nenhuma conversa encontrada</div>';
        return;
      }

      container.innerHTML = chats.map(chat => {
        const initial = (chat.name || '?')[0].toUpperCase();
        const lastMsg = chat.lastMessage ? chat.lastMessage.body : '';
        const isActive = chat.id === currentChatId ? 'active' : '';
        const unread = chat.unreadCount > 0
          ? `<div class="unread-badge">${chat.unreadCount}</div>` : '';

        return `
          <div class="chat-item ${isActive}" onclick="openChat('${chat.id}', '${(chat.name || '').replace(/'/g, "\\'")}')">
            <div class="chat-avatar">${initial}</div>
            <div class="chat-info">
              <h4>${chat.name || chat.id}</h4>
              <p>${lastMsg}</p>
            </div>
            ${unread}
          </div>
        `;
      }).join('');
    }

    function filterChats() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allChats.filter(c =>
        (c.name || c.id).toLowerCase().includes(query)
      );
      renderChats(filtered);
    }

    async function openChat(chatId, name) {
      currentChatId = chatId;
      lastMessageId = null;

      document.getElementById('no-chat').style.display = 'none';
      document.getElementById('active-chat').style.display = 'flex';
      document.getElementById('chat-contact-name').textContent = name || chatId;
      document.getElementById('chat-contact-avatar').textContent = (name || '?')[0].toUpperCase();
      document.getElementById('messages-container').innerHTML = '';

      // Mark active in sidebar
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      await loadMessages(chatId);
      document.getElementById('message-input').focus();
    }

    async function loadMessages(chatId) {
      try {
        const res = await fetch(`${API_URL}/api/chat/messages/${encodeURIComponent(chatId)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error);

        const container = document.getElementById('messages-container');
        const messages = data.messages || [];

        // Append-only: only add new messages
        const existingIds = new Set();
        container.querySelectorAll('.message').forEach(el => {
          existingIds.add(el.dataset.id);
        });

        messages.forEach(msg => {
          if (existingIds.has(msg.id)) return;

          const div = document.createElement('div');
          div.className = `message ${msg.fromMe ? 'sent' : 'received'}`;
          div.dataset.id = msg.id;

          const time = new Date(msg.timestamp * 1000).toLocaleTimeString('pt-BR', {
            hour: '2-digit', minute: '2-digit'
          });

          const mediaIcon = msg.hasMedia ? '📎 ' : '';
          div.innerHTML = `
            <div>${mediaIcon}${escapeHtml(msg.body || (msg.hasMedia ? '[Mídia]' : ''))}</div>
            <div class="time">${time}</div>
          `;
          container.appendChild(div);
        });

        // Scroll to bottom
        container.scrollTop = container.scrollHeight;

        if (messages.length > 0) {
          lastMessageId = messages[messages.length - 1].id;
        }
      } catch (err) {
        console.error('Erro ao carregar mensagens:', err);
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      if (!message || !currentChatId) return;

      input.value = '';

      // Optimistic UI
      const container = document.getElementById('messages-container');
      const div = document.createElement('div');
      div.className = 'message sent';
      const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `<div>${escapeHtml(message)}</div><div class="time">${time} ⏳</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch(`${API_URL}/api/chat/send`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ chatId: currentChatId, message })
        });

        const data = await res.json();
        if (data.success) {
          div.querySelector('.time').textContent = time + ' ✓';
        } else {
          div.querySelector('.time').textContent = time + ' ✗';
        }
      } catch (err) {
        div.querySelector('.time').textContent = time + ' ✗';
        console.error('Erro ao enviar:', err);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function refreshChats() {
      loadChats();
      if (currentChatId) {
        loadMessages(currentChatId);
      }
    }

    // Init
    checkAccess();
    loadChats();

    // Auto-refresh
    setInterval(() => {
      if (currentChatId) {
        loadMessages(currentChatId);
      }
    }, 5000);

    setInterval(loadChats, 30000);
  </script>

  <script src="/js/session-checker.js"></script>
</body>
</html>
