<!DOCTYPE html>
<html>
<head>
    <title>Teste - Funcionalidades Premium</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        textarea { width: 100%; height: 200px; }
        .result { background: #f0f0f0; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🧪 Teste - Funcionalidades PREMIUM</h1>
    
    <div class="section">
        <h2>1️⃣ Processar Números Colados</h2>
        <textarea id="phoneList" placeholder="Cole os números aqui (qualquer formato):
+55 61 99999-9999
(61) 98888-8888
61 9 7777-7777
96666-6666"></textarea>
        <button onclick="processPhones()">Processar</button>
        <div id="phoneResult" class="result"></div>
    </div>
    
    <div class="section">
        <h2>2️⃣ Google Contacts</h2>
        <button onclick="connectGoogle()">Conectar Google</button>
        <button onclick="syncContacts()">Sincronizar Contatos</button>
        <div id="googleResult" class="result"></div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        const token = prompt('Cole seu token JWT (faça login primeiro):');
        
        async function processPhones() {
            const text = document.getElementById('phoneList').value;
            const result = document.getElementById('phoneResult');
            
            try {
                const res = await fetch(`${API_URL}/api/contacts/process-paste`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text, userDDD: '61' })
                });
                
                const data = await res.json();
                result.innerHTML = `
                    <h3>Resultado:</h3>
                    ✅ Válidos: ${data.valid?.length || 0}<br>
                    ❌ Inválidos: ${data.invalid?.length || 0}<br>
                    🔄 Duplicados removidos: ${data.duplicates || 0}<br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (err) {
                result.innerHTML = `❌ Erro: ${err.message}`;
            }
        }
        
        async function connectGoogle() {
            const result = document.getElementById('googleResult');
            try {
                const res = await fetch(`${API_URL}/api/google/auth`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                window.open(data.authUrl, '_blank', 'width=600,height=600');
                result.innerHTML = '✅ Janela de autorização aberta!';
            } catch (err) {
                result.innerHTML = `❌ Erro: ${err.message}`;
            }
        }
        
        async function syncContacts() {
            const result = document.getElementById('googleResult');
            result.innerHTML = '⏳ Sincronizando...';
            try {
                const res = await fetch(`${API_URL}/api/google/sync`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                result.innerHTML = `✅ Sincronizado! Total: ${data.total} | Importados: ${data.imported}`;
            } catch (err) {
                result.innerHTML = `❌ Erro: ${err.message}`;
            }
        }
    </script>
</body>
</html>
